syntax = "proto3";

package bidstorm.bidding;

// Contract between the exchange and DSP bidders. The exchange sends one BidRequest per
// auction (possibly with multiple impressions) and each DSP answers with zero or more
// bids. The gRPC deadline carries the remaining latency budget.
service Bidder {
  rpc Bid (BidRequest) returns (BidResponse);
  // Win notification so DSPs can update spend / pacing.
  rpc NotifyWin (WinNotice) returns (Ack);
}

message Impression {
  string id = 1;
  int32 width = 2;
  int32 height = 3;
  int32 position = 4;
  double bid_floor = 5;
  string tag_id = 6;
}

message BidRequest {
  string id = 1;
  repeated Impression imps = 2;
  string site_domain = 3;
  repeated string site_categories = 4;
  string publisher_id = 5;
  int32 device_type = 6;
  string os = 7;
  string country = 8;
  string user_id = 9;
  repeated string user_segments = 10;
  int32 auction_type = 11;
  int32 tmax_ms = 12;
  int64 timestamp_ms = 13;
}

message Bid {
  string imp_id = 1;
  double price = 2;      // CPM, USD
  string creative_id = 3;
  string adomain = 4;
  string adm = 5;
  double predicted_ctr = 6;
}

message BidResponse {
  string request_id = 1;
  string bidder = 2;
  repeated Bid bids = 3;
  int32 processing_time_us = 4;
}

message WinNotice {
  string request_id = 1;
  string imp_id = 2;
  double clearing_price = 3; // CPM, USD
  string creative_id = 4;
}

message Ack {
  bool ok = 1;
}
