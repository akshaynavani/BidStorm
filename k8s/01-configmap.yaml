apiVersion: v1
kind: ConfigMap
metadata:
  name: bidstorm-config
  namespace: bidstorm
data:
  REDIS_URL: redis://redis:6379/0
  DMP_TIMEOUT_MS: "5"
  KAFKA_ENABLED: "true"
  # Point at your Kafka cluster (e.g. a Strimzi bootstrap service).
  KAFKA_BOOTSTRAP: bidstorm-kafka-bootstrap:9092
  KAFKA_TOPIC_PREFIX: bidstorm
  EXCHANGE_TMAX_MS: "80"
  EXCHANGE_OVERHEAD_MS: "10"
  EXCHANGE_AUCTION_TYPE: "2"
  EXCHANGE_PUBLIC_URL: http://bidstorm.local
  # DSP services are headless; the dns:/// scheme lets each gRPC channel resolve every pod
  # and round-robin across them (a ClusterIP would pin a long-lived channel to one pod).
  EXCHANGE_DSP_ENDPOINTS: dsp-alpha=dns:///dsp-alpha:50051,dsp-beta=dns:///dsp-beta:50051,dsp-gamma=dns:///dsp-gamma:50051
