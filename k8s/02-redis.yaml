apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bidstorm
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "512mb",
                 "--maxmemory-policy", "volatile-lru"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bidstorm
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
